###### Switch Templates --------------------------------------

template:
  - triggers:
      - trigger: state
        entity_id: sensor.front_door_pico
    switch:
      - name: Pico Frontdoor
        state: "{{ is_state('sensor.front_door_pico', '1') }}"
        turn_on:
          action: switch.turn_on
          target:
            entity_id: switch.patio_string

  - triggers:
      - trigger: state
        entity_id: sensor.front_door_pico
    switch:
      - name: Pico Frontdoor
        state: "{{ is_state('sensor.front_door_pico', '4') }}"
        turn_off:
          action: switch.turn_off
          target:
            entity_id: switch.patio_string
